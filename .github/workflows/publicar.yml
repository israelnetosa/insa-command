# Compila o INSA Command num Windows real e publica o release quando a versão do package.json muda na main.
# Se o release da versão já existe, não faz nada. Os apps instalados leem os releases e se atualizam sozinhos.
# Nenhum dado de carteira passa por aqui: os dados ficam só no computador do dono.
name: Publicar versão
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Versão nova?
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="$(node -p "require('./package.json').version")"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          if gh release view "v$versao" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$versao já existe: nada a publicar."; echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.publicar == 'sim'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.publicar == 'sim'
        run: npm ci
      - if: steps.v.outputs.publicar == 'sim'
        run: npm test
      - if: steps.v.outputs.publicar == 'sim'
        run: npm run typecheck
      - if: steps.v.outputs.publicar == 'sim'
        run: npm run build:desktop
      - name: Criar a tag da versão
        if: steps.v.outputs.publicar == 'sim'
        shell: bash
        run: |
          t="v${{ steps.v.outputs.versao }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then
            git tag "$t" "$GITHUB_SHA" && git push origin "$t"
          fi
      - name: Compilar e publicar
        if: steps.v.outputs.publicar == 'sim'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ github.token }}
