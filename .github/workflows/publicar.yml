# Compila o INSA Command num Windows real e publica o release quando a versão do package.json muda na main.
# Se o release da versão já existe, não faz nada. Os apps instalados leem os releases e se atualizam sozinhos.
# Nenhum dado de carteira passa por aqui: os dados ficam só no computador do dono.
name: Publicar versão
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Versão nova?
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="$(node -p "require('./package.json').version")"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          nomes="$(gh release view "v$versao" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if echo "$nomes" | grep -qx "latest.yml" && echo "$nomes" | grep -qx "INSA-Command-Setup-$versao.exe"; then
            echo "Release v$versao completo: nada a publicar."; echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$nomes" ] || gh release view "v$versao" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v$versao incompleto: apagando para publicar de novo (a tag fica)."
              gh release delete "v$versao" --repo "$GITHUB_REPOSITORY" --yes
            fi
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.publicar == 'sim'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.publicar == 'sim'
        run: npm ci
      - if: steps.v.outputs.publicar == 'sim'
        run: npm test
      - if: steps.v.outputs.publicar == 'sim'
        run: npm run typecheck
      - if: steps.v.outputs.publicar == 'sim'
        run: npm run build:desktop
      - name: Compilar o instalador
        if: steps.v.outputs.publicar == 'sim'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publicar o release (instalador + blockmap + latest.yml)
        if: steps.v.outputs.publicar == 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.versao }}"
          grep -q "^version: $v$" release/latest.yml
          ls -la release/*.exe release/*.blockmap release/latest.yml
          git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null || { git tag "v$v" "$GITHUB_SHA" && git push origin "v$v"; }
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --verify-tag --title "INSA Command $v" \
            --notes "Versão $v. O app instalado baixa sozinho e pede para reiniciar. Nenhum dado de carteira é publicado aqui." \
            "release/INSA-Command-Setup-$v.exe" "release/INSA-Command-Setup-$v.exe.blockmap" release/latest.yml
