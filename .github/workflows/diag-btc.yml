name: diag-btc
on: { push: { branches: [diag-btc] } }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (INSA-Command; uso pessoal)'
          for s in BTC-BRL BTC-USD BRL%3DX; do echo "== yahoo $s"; curl -sS -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/$s?range=1d&interval=5m" | head -c 400; echo; done
          echo "== coingecko"; curl -sS "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl&include_24hr_change=true&include_last_updated_at=true"; echo
          echo "== mercadobitcoin"; curl -sS "https://api.mercadobitcoin.net/api/v4/tickers?symbols=BTC-BRL" | head -c 400; echo
          echo "== binance"; curl -sS "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCBRL" | head -c 400; echo
